name: Feature request / 機能の提案
description: Something TEKITO could do, or do better. / 新しい機能や改善の提案。
title: "Request: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove anything private before you submit.
        Issue は公開されます。送る前に、知られたくない内容は消してください。
  - type: textarea
    id: request
    attributes:
      label: Request / 提案
      placeholder: Let the switch key skip Direct.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: When it would help / 役立つ場面
