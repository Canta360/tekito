# CLA Assistant Lite (https://github.com/contributor-assistant/github-action):
# a contributor signs by commenting the sentence below on their pull request;
# signatures are kept in signatures/cla.json on the "cla-signatures" branch of
# this repository. Pinned by commit: v2.6.1 is the latest release (checked
# 2026-11-11). The document link is the CLA at its tag (cla-v1.0, made when
# CLA.md is published), so a signature always names the text that was signed.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Canta360/tekito/blob/cla-v1.0/CLA.md
          branch: cla-signatures
          allowlist: Canta360
